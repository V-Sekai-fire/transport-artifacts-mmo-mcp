<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party · Live</title>
<style>
  :root {
    --bg: #14110d;
    --bg2: #1e1a14;
    --panel: #24201a;
    --line: #3a3226;
    --line-dim: #2a241e;
    --ink: #f4ede0;
    --dim: #a8967e;
    --dim2: #78685a;
    --accent: #ff9a3d;
    --live: #ff3a5e;
    --hp: #d94a3a;
    --xp: #6fce6a;
    --cd: #e8a33d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 20% 0%, #201911 0%, var(--bg) 45%) fixed;
    color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
    padding: 14px; min-height: 100vh;
  }

  header {
    display: flex; align-items: center; gap: 14px; padding: 4px 8px;
    flex-wrap: wrap;
  }
  h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: .01em; }
  h1 .sub { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--live); color: #fff; font: 700 11px/1 system-ui;
    padding: 5px 10px; border-radius: 4px; letter-spacing: .1em;
  }
  .live::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); }
    50% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
  }
  header .worldlink {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); text-decoration: none;
    padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 13px;
    transition: border-color .15s, transform .15s;
  }
  header .worldlink:hover { border-color: var(--accent); transform: translateY(-1px); }
  header .worldlink::after { content: "→"; color: var(--accent); font-weight: 800; }
  header .meta { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* Party — five character cards */
  #party {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    align-content: start;
  }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #1a1712 100%);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; position: relative; overflow: hidden;
    display: grid; grid-template-columns: 88px 1fr; gap: 14px;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    border: 2px solid var(--card-color, var(--line)); opacity: .3;
  }
  .card.busy {
    box-shadow: 0 0 0 1px var(--card-color, var(--accent)),
                0 8px 24px rgba(0,0,0,.45);
    transform: translateY(-1px);
  }
  .card.busy::before { opacity: .8; }
  .card .sprite-wrap {
    width: 88px; height: 88px;
    background: #0a0806; border-radius: 8px;
    display: grid; place-items: center;
    border: 3px solid var(--card-color, var(--line));
    box-shadow: inset 0 0 12px rgba(0,0,0,.4);
    position: relative;
  }
  .card .sprite-wrap img {
    width: 72px; height: 72px; image-rendering: pixelated;
    transition: transform .5s ease;
  }
  .card.busy .sprite-wrap img { animation: bob 1s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .card .sprite-wrap .layerbadge {
    position: absolute; bottom: -6px; right: -6px;
    background: #0a0806; border: 2px solid var(--card-color, var(--line));
    color: var(--ink); font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 8px; text-transform: capitalize;
  }
  .info { display: flex; flex-direction: column; min-width: 0; }
  .info .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .info .name { font-size: 17px; font-weight: 800; color: var(--card-color, var(--ink)); }
  .info .lvl { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .info .doing {
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    margin-top: 4px; min-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info .doing.idle { color: var(--dim); font-weight: 400; }
  .bars { margin-top: 8px; display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center;
         font-size: 10px; color: var(--dim2); font-variant-numeric: tabular-nums; }
  .bar .track { height: 6px; background: #0a0806; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 3px rgba(0,0,0,.5); }
  .bar .fill { height: 100%; border-radius: 3px; transition: width .3s linear; }
  .foot {
    grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px;
    padding-top: 10px; margin-top: 4px; border-top: 1px dashed var(--line-dim);
    color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .foot .pos { font-weight: 600; color: var(--dim); }
  .foot .actions-mini { color: var(--dim2); }

  /* Global action feed */
  #feedbar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px;
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
  }
  #feedbar h2 {
    font-size: 10px; font-weight: 700; margin: 0; color: var(--dim);
    letter-spacing: .12em; text-transform: uppercase;
  }
  #feed {
    display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden;
    scroll-behavior: smooth; scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  .feed-item {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg2); border: 1px solid var(--line-dim);
    padding: 5px 10px; border-radius: 20px; font-size: 11.5px;
    flex-shrink: 0;
  }
  .feed-item img { width: 16px; height: 16px; image-rendering: pixelated; }
  .feed-item .fn { font-weight: 700; }
  .feed-item .fa { color: var(--dim); }
  .feed-item .fg { color: var(--dim2); font-variant-numeric: tabular-nums; }

  #empty {
    grid-column: 1 / -1;
    display: grid; place-items: center; color: var(--dim); padding: 60px 0;
  }
</style>
</head>
<body>
<header>
  <h1>Party <span class="sub">·</span></h1>
  <span class="live">LIVE</span>
  <span class="meta" id="status">loading…</span>
  <a class="worldlink" href="/world">World Map</a>
</header>

<main id="party"></main>

<div id="feedbar">
  <h2>Actions</h2>
  <div id="feed"><span class="fa" style="color:var(--dim)">nothing yet — start a run through /mcp</span></div>
</div>

<script>
const PALETTE = [
  { sprite: "/static/tiles/battle/tile_0160.png", color: "#e0483e" },
  { sprite: "/static/tiles/battle/tile_0142.png", color: "#3a83d4" },
  { sprite: "/static/tiles/battle/tile_0124.png", color: "#4aa960" },
  { sprite: "/static/tiles/battle/tile_0178.png", color: "#e08c2a" },
  { sprite: "/static/tiles/battle/tile_0106.png", color: "#8a8a8a" },
];
const charColor = (name) => {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
};

const VERB = {
  move: "moving", fight: "fighting", gathering: "gathering", crafting: "crafting",
  rest: "resting", recycling: "recycling", use: "using an item", equip: "equipping",
  unequip: "unequipping", "task/new": "taking a task", "task/complete": "turning in",
  "bank/deposit/item": "banking", "bank/withdraw/item": "withdrawing",
  "npc/buy": "buying", "npc/sell": "selling", transition: "descending",
};

let world = { characters: [], feed: [] };

function cooldownLeft(c) {
  return c.cooldown_expiration ? Math.max(0, (new Date(c.cooldown_expiration) - Date.now()) / 1000) : 0;
}

function doingText(c) {
  const cd = cooldownLeft(c);
  const last = c.last_action;
  if (cd > 0 && last) return { text: `${VERB[last.action] || last.action} · ${cd.toFixed(1)}s`, busy: true };
  if (cd > 0) return { text: `busy · ${cd.toFixed(1)}s`, busy: true };
  if (last) return { text: `just finished ${VERB[last.action] || last.action}`, busy: false };
  return { text: "idle", busy: false };
}

function renderParty() {
  const el = document.getElementById("party");
  if (!world.characters.length) {
    el.innerHTML = `<div id="empty">Waiting for the API to answer with characters…</div>`;
    return;
  }
  el.innerHTML = world.characters.map(c => {
    const pal = charColor(c.name);
    const d = doingText(c);
    const cd = cooldownLeft(c);
    const total = c.cooldown || 0;
    const cdPct = total > 0 ? Math.max(0, Math.min(100, (cd / total) * 100)) : 0;
    const hpPct = c.max_hp > 0 ? (c.hp / c.max_hp) * 100 : 0;
    const xpPct = c.max_xp > 0 ? (c.xp / c.max_xp) * 100 : 0;

    // Per-character recent actions from the global feed, last 3.
    const mine = (world.feed || []).filter(f => f.character === c.name).slice(0, 3);
    const miniActions = mine.length
      ? mine.map(f => VERB[f.action] || f.action).join(" · ")
      : "no actions yet";

    return `
    <article class="card ${d.busy ? "busy" : ""}" style="--card-color:${pal.color}">
      <div class="sprite-wrap">
        <img src="${pal.sprite}" alt="${c.name}">
        <span class="layerbadge">${c.layer || "?"}</span>
      </div>
      <div class="info">
        <div class="top">
          <span class="name">${c.name}</span>
          <span class="lvl">lv ${c.level} · ${c.gold}g</span>
        </div>
        <div class="doing ${d.busy ? "" : "idle"}">${d.text}</div>
        <div class="bars">
          <div class="bar"><span>HP</span><span class="track"><span class="fill" style="width:${hpPct}%;background:var(--hp)"></span></span><span>${c.hp}/${c.max_hp}</span></div>
          <div class="bar"><span>XP</span><span class="track"><span class="fill" style="width:${xpPct}%;background:var(--xp)"></span></span><span>${c.xp}/${c.max_xp}</span></div>
          <div class="bar"><span>CD</span><span class="track"><span class="fill" style="width:${cdPct}%;background:var(--cd)"></span></span><span>${cd > 0 ? cd.toFixed(1) + "s" : "ready"}</span></div>
        </div>
      </div>
      <div class="foot">
        <span class="pos">(${c.x}, ${c.y}) · bag ${c.inventory_used}/${c.inventory_max_items}</span>
        <span class="actions-mini">${miniActions}</span>
      </div>
    </article>`;
  }).join("");
}

function renderFeed() {
  const el = document.getElementById("feed");
  const feed = world.feed || [];
  if (!feed.length) {
    el.innerHTML = `<span class="fa" style="color:var(--dim)">nothing yet — start a run through /mcp</span>`;
    return;
  }
  const now = Date.now();
  el.innerHTML = feed.slice(0, 20).map(f => {
    const pal = charColor(f.character);
    const age = Math.round((now - new Date(f.at)) / 1000);
    const ago = age < 60 ? age + "s" : Math.round(age / 60) + "m";
    return `<div class="feed-item">
      <img src="${pal.sprite}">
      <span class="fn" style="color:${pal.color}">${f.character}</span>
      <span class="fa">${VERB[f.action] || f.action}</span>
      <span class="fg">${ago}</span>
    </div>`;
  }).join("");
}

async function poll() {
  try {
    // /api/world already carries the character snapshot AND the action feed.
    const res = await fetch("/api/world", { cache: "no-store" });
    world = await res.json();
    document.getElementById("status").textContent =
      `${world.characters.length} characters · updated ${world.fetched_at ? new Date(world.fetched_at).toLocaleTimeString() : "…"}`;
    renderParty();
    renderFeed();
  } catch {
    document.getElementById("status").textContent = "server unreachable";
  }
}

poll();
setInterval(poll, 2000);
// Cooldown numbers tick locally between polls so the card reads live.
setInterval(renderParty, 200);
</script>
</body>
</html>
