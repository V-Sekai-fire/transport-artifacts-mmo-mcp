<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Live</title>
<style>
  :root {
    --bg: #eee4d1;
    --panel: #fefbf1;
    --line: #a8967e;
    --ink: #1c1a17;
    --dim: #78685a;
    --accent: #c45a1a;
    --live: #d63a5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 1fr 340px; gap: 10px; padding: 10px;
    height: 100vh; overflow: hidden;
  }
  #main { display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 0 4px 8px; }
  h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  h1 a { color: var(--accent); text-decoration: none; margin-left: 12px; font-weight: 500; font-size: 13px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--live); color: #fff; font: 700 10px/1 system-ui;
    padding: 4px 8px; border-radius: 3px; letter-spacing: .08em;
  }
  .live::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,.6);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.6); } 100% { box-shadow: 0 0 0 8px rgba(255,255,255,0); } }
  .layers { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .layers button {
    background: transparent; color: var(--ink); border: 0; border-right: 1px solid var(--line);
    padding: 6px 14px; cursor: pointer; font: inherit; text-transform: capitalize;
  }
  .layers button:last-child { border-right: 0; }
  .layers button.active { background: var(--accent); color: #1a1712; font-weight: 700; }
  .meta { color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
  #stage {
    flex: 1; background: #f8f2e2; border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; position: relative; cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none;
        image-rendering: pixelated; image-rendering: crisp-edges; }
  .tile-hit { fill: transparent; }
  .content-sprite { image-rendering: auto; }
  .word-text {
    font: 700 4.5px system-ui, sans-serif; text-anchor: middle;
    dominant-baseline: central; pointer-events: none;
  }
  .player-sprite { image-rendering: auto; }
  .player-name {
    font: 700 4px system-ui, sans-serif; text-anchor: middle;
    fill: #fff; paint-order: stroke;
    stroke: #000; stroke-width: 1; stroke-linejoin: round;
  }
  .cluster-badge {
    font: 700 6px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central;
    fill: #000;
  }
  #tooltip {
    position: absolute; pointer-events: none; background: #1c1a17; color: #f4ede0;
    border: 1px solid #000; border-radius: 4px; padding: 6px 10px;
    font-size: 12px; max-width: 260px; display: none; z-index: 20;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
  }
  #tooltip b { color: var(--accent); }
  #tooltip .type { color: var(--dim); font-size: 11px; }
  #hint { position: absolute; bottom: 8px; right: 10px; color: var(--dim); font-size: 11px;
          background: rgba(26,23,18,.9); padding: 3px 8px; border-radius: 3px; }

  /* Sidebar */
  #side { display: flex; flex-direction: column; gap: 10px; overflow: hidden; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .panel h2 { font-size: 10px; font-weight: 700; margin: 0 0 10px; color: var(--dim);
              letter-spacing: .1em; text-transform: uppercase; }

  /* Hosted persona card — the "streamer" featured slot */
  #hosted {
    padding: 0; overflow: hidden;
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--panel) 0%, #1e1a15 100%);
  }
  #hosted-top { padding: 10px 12px 4px; display: flex; align-items: center; gap: 8px; }
  #hosted-top .live { flex: 0 0 auto; }
  #hosted-top .now { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  #hosted-body { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 4px 12px 12px; }
  #hosted-sprite {
    width: 96px; height: 96px; background: #fefbf1; border-radius: 6px;
    display: grid; place-items: center; border: 3px solid var(--accent);
    box-shadow: 0 0 0 2px #0a0806;
  }
  #hosted-sprite img { width: 80px; height: 80px; image-rendering: pixelated; }
  #hosted-info .name { font-size: 20px; font-weight: 800; letter-spacing: .01em; margin-bottom: 2px; }
  #hosted-info .sub { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  #hosted-info .doing { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; min-height: 18px; }
  #hosted-info .doing.idle { color: var(--dim); font-weight: 500; }
  .bar { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center;
         font-size: 10px; color: var(--dim); margin-bottom: 3px; }
  .bar .track { height: 5px; background: #0f0d0a; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; transition: width .3s linear; }
  #hosted-dots { display: flex; justify-content: center; gap: 6px; padding: 6px 0 10px; }
  #hosted-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); cursor: pointer; }
  #hosted-dots span.active { background: var(--accent); }

  /* Feed */
  #feed { overflow-y: auto; max-height: 220px; margin: -4px 0 0; }
  .feed-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); font-size: 12px;
  }
  .feed-row:last-child { border-bottom: none; }
  .feed-row img { width: 20px; height: 20px; image-rendering: pixelated; }
  .feed-row .fname { font-weight: 600; }
  .feed-row .fact { color: var(--dim); }
  .feed-row .fago { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }

  /* Character list */
  #chars-panel { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #chars { overflow-y: auto; min-height: 0; margin: -4px 0 0; }
  .row { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255,255,255,.03); }
  .row.active { background: rgba(255,154,61,.08); }
  .row img { width: 24px; height: 24px; image-rendering: pixelated; flex: 0 0 auto; }
  .row .info { flex: 1; min-width: 0; }
  .row .info .name { font-weight: 600; font-size: 12px; }
  .row .info .sub { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="main">
  <header>
    <h1>World · Live</h1>
    <span class="live">LIVE</span>
    <div class="layers" id="layers"></div>
    <span class="meta" id="status">loading…</span>
  </header>
  <div id="stage">
    <svg id="canvas"></svg>
    <div id="tooltip"></div>
    <div id="hint">drag to pan · scroll to zoom · hover a tile</div>
  </div>
</div>
<aside id="side">
  <div class="panel" id="hosted">
    <div id="hosted-top">
      <span class="live">ON AIR</span>
      <span class="now" id="hosted-now">next in 8s</span>
    </div>
    <div id="hosted-body">
      <div id="hosted-sprite"></div>
      <div id="hosted-info">
        <div class="name" id="hosted-name">—</div>
        <div class="sub" id="hosted-sub">—</div>
        <div class="doing idle" id="hosted-doing">—</div>
        <div class="bar"><span>HP</span><span class="track"><span class="fill" id="hosted-hp" style="background:#d43a2a"></span></span><span id="hosted-hp-text">—</span></div>
        <div class="bar"><span>XP</span><span class="track"><span class="fill" id="hosted-xp" style="background:#6ac364"></span></span><span id="hosted-xp-text">—</span></div>
        <div class="bar"><span>CD</span><span class="track"><span class="fill" id="hosted-cd" style="background:var(--accent)"></span></span><span id="hosted-cd-text">—</span></div>
      </div>
    </div>
    <div id="hosted-dots"></div>
  </div>

  <div class="panel">
    <h2>Recent Actions</h2>
    <div id="feed"><div class="feed-row"><span class="fact">nothing yet</span></div></div>
  </div>

  <div class="panel" id="chars-panel">
    <h2>Characters (<span id="char-count">0</span>)</h2>
    <div id="chars"></div>
  </div>
</aside>

// Wan-generated PNGs override the vector icon when a manifest lists them,
// so a future render pass silently upgrades any category without a code
// change. Absent manifest = words + icons stay as they are.
const wanExists = new Set();
async function loadWanManifest() {
  try {
    const res = await fetch("/static/wan/manifest.json", { cache: "no-cache" });
    if (!res.ok) return;
    for (const k of await res.json()) wanExists.add(k);
  } catch { /* no wan sprites yet */ }
}

function iconFor(type, code) {
  code = code || "";
  const wanKey = `${type}-${code}`;
  if (wanExists.has(wanKey)) return { sprite: `/static/wan/${wanKey}.png`, border: "#c45a1a" };
  if (type === "bank") return { icon: "chest_i", border: "#a67a3a" };
  if (type === "grand_exchange") return { icon: "coin", border: "#c27ac6" };
  if (type === "raid") {
    if (/fairy/.test(code)) return { icon: "fairy", border: "#c62d3d" };
    return { icon: "eye", border: "#c62d3d" };
  }
  if (type === "tasks_master") return { icon: "scroll", border: "#7a4a1a" };
  if (type === "npc") {
    if (/wizard|sorc/.test(code)) return { icon: "hood", border: "#3a5aa8" };
    if (/vendor/.test(code)) return { icon: "book", border: "#3a5aa8" };
    if (/trader|task/.test(code)) return { icon: "scroll", border: "#3a5aa8" };
    if (/arch/.test(code)) return { icon: "arch", border: "#3a5aa8" };
    if (/tailor/.test(code)) return { icon: "gem", border: "#3a5aa8" };
    if (/beast/.test(code)) return { icon: "paw", border: "#3a5aa8" };
    return { icon: "hood", border: "#3a5aa8" };
  }
  if (type === "workshop") {
    if (code === "mining") return { icon: "pickaxe", border: "#7a5a2a" };
    if (code === "woodcutting") return { icon: "axe", border: "#7a5a2a" };
    if (code === "weaponcrafting") return { icon: "hammer_i", border: "#7a5a2a" };
    if (code === "gearcrafting") return { icon: "hammer_i", border: "#7a5a2a" };
    if (code === "alchemy") return { icon: "potion", border: "#7a5a2a" };
    if (code === "jewelrycrafting") return { icon: "gem", border: "#7a5a2a" };
    if (code === "cooking") return { icon: "pot", border: "#7a5a2a" };
    return { word: code, border: "#7a5a2a" };
  }
  if (type === "resource") {
    if (/_tree|_wood/.test(code)) return { icon: "tree_i", border: "#3a8a4a" };
    if (/_rocks|_ore/.test(code)) return { icon: "ore", border: "#7a6a4a" };
    if (/_spot/.test(code)) return { icon: "fish", border: "#3a83d4" };
    if (/mushroom/.test(code)) return { icon: "mushroom_i", border: "#a3572d" };
    if (/glowstem|nettle|plant/.test(code)) return { icon: "flower", border: "#6a3a9a" };
    if (/sunflower/.test(code)) return { icon: "flower", border: "#c8a02a" };
    if (/cactus/.test(code)) return { icon: "cactus", border: "#3a8a4a" };
    return { word: code.replace(/_/g, " "), border: "#3a8a4a" };
  }
  if (type === "monster") {
    if (/dragon/.test(code)) return { icon: "dragon", border: "#c62d3d" };
    if (/slime/.test(code)) return { icon: "slime", border: "#4a9a4a" };
    if (/skeleton|lich|death_knight/.test(code)) return { icon: "skull", border: "#8a7a6a" };
    if (/spider/.test(code)) return { icon: "spider", border: "#7a4a2a" };
    if (/snake|serpent/.test(code)) return { icon: "snake", border: "#3a8a3a" };
    if (/scorpion|beetle/.test(code)) return { icon: "spider", border: "#a86a3a" };
    if (/wolf|hellhound|fennec/.test(code)) return { icon: "paw", border: "#8a5a3a" };
    if (/bat/.test(code)) return { icon: "bat", border: "#5a3a7a" };
    if (/goblin|imp/.test(code)) return { icon: "hood", border: "#3a7a3a" };
    if (/orc|ogre|cyclops|highwayman/.test(code)) return { icon: "fangs", border: "#7a3a3a" };
    if (/vampire/.test(code)) return { icon: "bat", border: "#c62d3d" };
    if (/cultist/.test(code)) return { icon: "hood", border: "#6a3a9a" };
    if (/flame|flameche/.test(code)) return { icon: "flame", border: "#e67a2a" };
    if (/dryad|cursed_tree|mushmush/.test(code)) return { icon: "tree_i", border: "#7a3a3a" };
    if (/flying/.test(code)) return { icon: "wing", border: "#4a5a9a" };
    if (/warden|guard|priestess|empress|rosen/.test(code)) return { icon: "hood", border: "#c62d3d" };
    if (/pig|cow|chicken|sheep|owlbear/.test(code)) return { icon: "paw", border: "#6a8a4a" };
    if (/rat/.test(code)) return { icon: "paw", border: "#8a5a3a" };
    return { icon: "sword_x", border: "#c62d3d" };
  }
  return { word: type, border: "#666" };
}

// Every character gets a stable color, so a red sprite on the map is always
// the same person as the red row in the sidebar.
const PALETTE = [
  { sprite: "/static/scribble/red_character.png",    color: "#e0483e" },
  { sprite: "/static/scribble/green_character.png",  color: "#4aa960" },
  { sprite: "/static/scribble/purple_character.png", color: "#8a5ec6" },
  { sprite: "/static/scribble/yellow_character.png", color: "#e0b83e" },
  // Scribble Dungeons ships only four colored characters. The fifth character
  // gets a name-badge in its own color — the "words when tiles are missing"
  // rule applied to the character sprites too.
  { sprite: null, color: "#3a83d4" },
];

// Terrain fill colors, keyed to the game "name" field. Pure SVG rects, so
// the map is resolution-independent — no composited PNG that can go wrong.
// Mirrors scripts/build_maps.py TERRAIN so the offline artefact and the
// live view agree.
const TERRAIN_FILL = {
  "Forest":            "#8ec882",
  "Sea":               "#6496d2",
  "Sandwhisper Isle":  "#e6d282",
  "City":              "#d7c8a5",
  "Graveyard":         "#a0a58c",
  "Enchanted Forest":  "#b991d2",
  "Mountain":          "#aa9b82",
  "Lake":              "#82beel",
  "Spawn":             "#ffd23c",
  "Forest (Forge)":    "#cdaa6e",
  "Empty":             null,
  "Lava Underground":  "#e66e3c",
  "Mine":              "#a5917d",
  "Sandwhisper Mine":  "#e6d28c",
  "Lich Tomb":         "#9b7dbe",
  "Abandoned House":   "#be9078",
  "Rosenblood House":  "#d28278",
  "Empress House":     "#ebc878",
};
const EMPTY_FILL = { overworld: "#8ec882", underground: "#cdc2aa", interior: null };

// Decor placed on top of terrain, per game name. Small individual PNGs, one
// per tile at most — scales without breaking because each image is 64 px.
const DECOR = {
  "Forest":            [["tree", 0.30], ["plants", 0.12]],
  "Enchanted Forest":  [["tree", 0.50], ["plants", 0.30]],
  "Sandwhisper Isle":  [["plants", 0.15]],
  "Mountain":          [["wall_damaged", 0.15]],
  "Graveyard":         [["coffin", 0.40]],
  "City":              [["chair", 0.10]],
  "Mine":              [["wall_damaged", 0.20]],
  "Lava Underground":  [["campfire", 0.15]],
  "Lich Tomb":         [["coffin", 0.50]],
};

// Deterministic PRNG so re-renders on the same tile get the same decor
// (no jitter as the map polls).
function tileRand(x, y, layer) {
  let h = ((x * 73856093) ^ (y * 19349663) ^ hashStr(layer)) >>> 0;
  return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 0x100000000; };
}
function hashStr(s) {
  let h = 0; for (const c of s) h = ((h * 31 + c.charCodeAt(0)) | 0) >>> 0;
  return h;
}

let world = { tiles: [], bounds: {}, characters: [], feed: [] };
let mapMeta = null;
let activeLayer = "overworld";
let view = { scale: 1, tx: 0, ty: 0, initialised: false };
let hostedIndex = 0;
let hostedElapsed = 0;
const HOST_ROTATE_S = 8;

const stage = document.getElementById("stage");
const svg = document.getElementById("canvas");
const tooltip = document.getElementById("tooltip");

const charColor = (name) => {
  // Stable hash → palette index, so the same name always gets the same slot.
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
};

function computeMeta(bounds) {
  const tile_size = 32;  // logical world-units per tile in the SVG
  const meta = {};
  for (const [layer, b] of Object.entries(bounds)) {
    meta[layer] = {
      ...b, tile_size,
      width:  (b.max_x - b.min_x + 1) * tile_size,
      height: (b.max_y - b.min_y + 1) * tile_size,
    };
  }
  return meta;
}

function renderLayerButtons() {
  const layers = Object.keys(world.bounds).sort();
  const el = document.getElementById("layers");
  if (el.dataset.layers !== layers.join(",")) {
    el.dataset.layers = layers.join(",");
    el.innerHTML = layers.map(l => `<button data-layer="${l}" class="${l === activeLayer ? "active" : ""}">${l}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      activeLayer = b.dataset.layer;
      view.initialised = false;
      renderLayerButtons();
      renderMap();
    }));
  } else {
    el.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.layer === activeLayer));
  }
}

function initialFit(m) {
  const pad = 8;  // pixels around the layer in the world's own units
  const rect = stage.getBoundingClientRect();
  const scale = Math.min(rect.width / (m.width + pad * 2), rect.height / (m.height + pad * 2));
  view = {
    scale,
    tx: (rect.width  - m.width  * scale) / 2,
    ty: (rect.height - m.height * scale) / 2,
    initialised: true,
  };
}

function tilePx(t, m) {
  return { px: (t.x - m.min_x) * m.tile_size, py: (t.y - m.min_y) * m.tile_size };
}

function renderMap() {
  const m = mapMeta && mapMeta[activeLayer];
  if (!m) { svg.innerHTML = ""; return; }
  if (!view.initialised) initialFit(m);

  const rect = stage.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);

  const tiles = world.tiles.filter(t => t.layer === activeLayer);
  const parts = [];

  // Terrain as inline SVG rects — vector, scales cleanly at any zoom.
  const empty = EMPTY_FILL[activeLayer];
  for (const t of tiles) {
    const { px, py } = tilePx(t, m);
    const fill = TERRAIN_FILL[t.name];
    const color = fill === null ? empty : (fill || empty);
    if (color) {
      parts.push(`<rect x="${px}" y="${py}" width="${m.tile_size}" height="${m.tile_size}" fill="${color}"/>`);
    }
  }

  // Deterministic decor on top of the terrain, keyed to the game "name".
  for (const t of tiles) {
    const decor = DECOR[t.name];
    if (!decor) continue;
    const rnd = tileRand(t.x, t.y, activeLayer);
    for (const [name, chance] of decor) {
      if (rnd() < chance) {
        const { px, py } = tilePx(t, m);
        parts.push(`<image href="/static/scribble/${name}.png" x="${px}" y="${py}" width="${m.tile_size}" height="${m.tile_size}" preserveAspectRatio="xMidYMid meet"/>`);
      }
    }
  }

  // Content overlays: an inline SVG icon or a word-label per tile.
  for (const t of tiles) {
    if (!t.content_type) continue;
    const { px, py } = tilePx(t, m);
    const c = iconFor(t.content_type, t.content_code || "");
    const inset = 1.5;
    parts.push(`<rect x="${px + inset}" y="${py + inset}" width="${m.tile_size - inset * 2}" height="${m.tile_size - inset * 2}" fill="#fefbf1" stroke="${c.border}" stroke-width="0.6" rx="2"/>`);
    if (c.sprite) {
      parts.push(`<image href="${c.sprite}" x="${px + inset + 1}" y="${py + inset + 1}" width="${m.tile_size - inset * 2 - 2}" height="${m.tile_size - inset * 2 - 2}"/>`);
    } else if (c.icon) {
      const iconInset = 2;
      const scale = (m.tile_size - inset * 2 - iconInset * 2) / 16;
      const tx = px + inset + iconInset;
      const ty = py + inset + iconInset;
      parts.push(`<g transform="translate(${tx} ${ty}) scale(${scale})" stroke="${c.border}" style="color:${c.border}"><use href="#i-${c.icon}"/></g>`);
    } else if (c.word) {
      const short = String(c.word).slice(0, 6);
      parts.push(`<text class="word-text" x="${px + m.tile_size / 2}" y="${py + m.tile_size / 2 + 1}" fill="${c.border}">${short}</text>`);
    }
  }

  // Transition arrows for uncontented tiles that have a layer link.
  for (const t of tiles) {
    if (t.content_type || !t.transition) continue;
    const { px, py } = tilePx(t, m);
    const stroke = t.transition_gated ? "#e0483e" : "#a8967e";
    parts.push(`<path d="M${px+3} ${py+8} L${px+13} ${py+8} M${px+10} ${py+5} L${px+13} ${py+8} L${px+10} ${py+11}" stroke="${stroke}" stroke-width="1.5" fill="none"/>`);
  }

  // Character sprites, grouped so co-located characters read as one badge.
  const clusters = new Map();
  for (const c of world.characters) {
    if (c.layer !== activeLayer) continue;
    const key = `${c.x},${c.y}`;
    if (!clusters.has(key)) clusters.set(key, []);
    clusters.get(key).push(c);
  }
  for (const [key, group] of clusters) {
    const [gx, gy] = key.split(",").map(Number);
    const px = (gx - m.min_x) * m.tile_size;
    const py = (gy - m.min_y) * m.tile_size;

    if (group.length === 1) {
      const c = group[0];
      const pal = charColor(c.name);
      if (pal.sprite) {
        parts.push(`<image class="player-sprite" href="${pal.sprite}" x="${px}" y="${py}" width="${m.tile_size}" height="${m.tile_size}"/>`);
      } else {
        // Fifth character: word-badge in the character's color.
        parts.push(`<circle cx="${px + m.tile_size / 2}" cy="${py + m.tile_size / 2}" r="${m.tile_size / 2 - 1}" fill="#fefbf1" stroke="${pal.color}" stroke-width="1.2"/>`);
        parts.push(`<text class="cluster-badge" x="${px + m.tile_size / 2}" y="${py + m.tile_size / 2 + 1}" fill="${pal.color}" style="font-size:5.5px">${c.name.replace(/Weft$/, "")}</text>`);
      }
      parts.push(`<text class="player-name" x="${px + m.tile_size / 2}" y="${py - 1}">${c.name}</text>`);
    } else {
      // Cluster: a stack of sprites with a count badge.
      group.slice(0, 3).forEach((c, i) => {
        const pal = charColor(c.name);
        const off = i * 2;
        if (pal.sprite) {
          parts.push(`<image class="player-sprite" href="${pal.sprite}" x="${px - off}" y="${py - off}" width="${m.tile_size}" height="${m.tile_size}"/>`);
        } else {
          parts.push(`<circle cx="${px - off + m.tile_size / 2}" cy="${py - off + m.tile_size / 2}" r="${m.tile_size / 2 - 1}" fill="#fefbf1" stroke="${pal.color}" stroke-width="1"/>`);
        }
      });
      const badgeX = px + m.tile_size - 2;
      const badgeY = py - 2;
      parts.push(`<circle cx="${badgeX}" cy="${badgeY}" r="4" fill="var(--accent)" stroke="#000" stroke-width="0.6"/>`);
      parts.push(`<text class="cluster-badge" x="${badgeX}" y="${badgeY + 0.3}">${group.length}</text>`);
    }
  }

  // Hover targets: one transparent rect per tile so the tooltip can name it.
  for (const t of tiles) {
    const { px, py } = tilePx(t, m);
    parts.push(`<rect class="tile-hit" x="${px}" y="${py}" width="${m.tile_size}" height="${m.tile_size}" data-i="${t.map_id}"/>`);
  }

  const defs = Object.entries(ICONS).map(([k, v]) =>
    `<symbol id="i-${k}" viewBox="0 0 16 16">${v}</symbol>`).join("");
  svg.innerHTML =
    `<defs>${defs}</defs>` +
    `<g id="viewport" transform="translate(${view.tx} ${view.ty}) scale(${view.scale})">${parts.join("")}</g>`;
  wireTooltips(tiles);
}

function wireTooltips(tiles) {
  const byId = new Map(tiles.map(t => [String(t.map_id), t]));
  svg.querySelectorAll(".tile-hit").forEach(r => {
    r.addEventListener("mousemove", (ev) => {
      const t = byId.get(r.dataset.i);
      if (!t) return;
      const rect = stage.getBoundingClientRect();
      tooltip.style.display = "block";
      tooltip.style.left = (ev.clientX - rect.left + 14) + "px";
      tooltip.style.top  = (ev.clientY - rect.top  + 14) + "px";
      let content = "";
      if (t.content_type) {
        content = `<div>${t.content_type.replace(/_/g, " ")}: <b>${t.content_code}</b></div>`;
      } else if (t.transition) {
        content = `<div>→ ${t.transition}${t.transition_gated ? " · locked" : ""}</div>`;
      }
      tooltip.innerHTML = `<b>${t.name || "?"}</b> <span class="type">(${t.x}, ${t.y})</span>${content}`;
    });
    r.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
  });
}

const VERB = {
  move: "moving", fight: "fighting", gathering: "gathering", crafting: "crafting",
  rest: "resting", recycling: "recycling", use: "using an item", equip: "equipping",
  unequip: "unequipping", "task/new": "taking a task", "task/complete": "turning in",
  "bank/deposit/item": "banking", "bank/withdraw/item": "withdrawing",
  "npc/buy": "buying", "npc/sell": "selling", transition: "descending",
};

function renderHosted() {
  if (!world.characters.length) return;
  const c = world.characters[hostedIndex % world.characters.length];
  const pal = charColor(c.name);
  const frame = document.getElementById("hosted-sprite");
  frame.style.borderColor = pal.color;
  if (pal.sprite) {
    frame.innerHTML = `<img src="${pal.sprite}" style="width:80px;height:80px" alt="${c.name}">`;
  } else {
    frame.innerHTML = `<div style="width:80px;height:80px;border-radius:50%;background:#fefbf1;border:3px solid ${pal.color};display:grid;place-items:center;color:${pal.color};font:800 16px system-ui">${c.name.replace(/Weft$/, "")}</div>`;
  }
  document.getElementById("hosted-name").textContent = c.name;
  document.getElementById("hosted-sub").textContent = `lv ${c.level} · ${c.gold}g · ${c.layer || "?"} (${c.x}, ${c.y})`;

  const cdLeft = c.cooldown_expiration ? Math.max(0, (new Date(c.cooldown_expiration) - Date.now()) / 1000) : 0;
  const doing = document.getElementById("hosted-doing");
  const last = c.last_action;
  if (cdLeft > 0 && last) { doing.textContent = `${VERB[last.action] || last.action} — ${cdLeft.toFixed(1)}s`; doing.classList.remove("idle"); }
  else if (cdLeft > 0)   { doing.textContent = `busy — ${cdLeft.toFixed(1)}s`; doing.classList.remove("idle"); }
  else if (last)         { doing.textContent = `just finished ${VERB[last.action] || last.action}`; doing.classList.add("idle"); }
  else                   { doing.textContent = "idle"; doing.classList.add("idle"); }

  const pct = (n, d) => d > 0 ? Math.min(100, (n / d) * 100) : 0;
  document.getElementById("hosted-hp").style.width = pct(c.hp, c.max_hp) + "%";
  document.getElementById("hosted-hp-text").textContent = `${c.hp}/${c.max_hp}`;
  document.getElementById("hosted-xp").style.width = pct(c.xp, c.max_xp) + "%";
  document.getElementById("hosted-xp-text").textContent = `${c.xp}/${c.max_xp}`;
  document.getElementById("hosted-cd").style.width = pct(Math.ceil(cdLeft), c.cooldown || 1) + "%";
  document.getElementById("hosted-cd-text").textContent = cdLeft > 0 ? `${cdLeft.toFixed(1)}s` : "ready";

  document.getElementById("hosted-now").textContent = `next in ${Math.max(0, HOST_ROTATE_S - hostedElapsed)|0}s`;

  const dots = document.getElementById("hosted-dots");
  dots.innerHTML = world.characters.map((_, i) =>
    `<span class="${i === hostedIndex % world.characters.length ? "active" : ""}" data-i="${i}"></span>`).join("");
  dots.querySelectorAll("span").forEach(s => s.addEventListener("click", () => {
    hostedIndex = Number(s.dataset.i); hostedElapsed = 0; renderHosted();
  }));
}

function renderChars() {
  document.getElementById("char-count").textContent = world.characters.length;
  document.getElementById("chars").innerHTML = world.characters.map((c, i) => {
    const pal = charColor(c.name);
    const cd = c.cooldown_expiration ? Math.max(0, (new Date(c.cooldown_expiration) - Date.now()) / 1000) : 0;
    const avatar = pal.sprite
      ? `<img src="${pal.sprite}">`
      : `<span style="width:24px;height:24px;border-radius:50%;background:#fefbf1;border:2px solid ${pal.color};color:${pal.color};font:800 9px system-ui;display:grid;place-items:center;flex:0 0 auto">${c.name.slice(0,2).toUpperCase()}</span>`;
    return `<div class="row ${i === hostedIndex % world.characters.length ? "active" : ""}" data-i="${i}">
      ${avatar}
      <div class="info">
        <div class="name" style="color:${pal.color}">${c.name}</div>
        <div class="sub">lv ${c.level} · ${c.layer || "?"} (${c.x}, ${c.y}) · ${cd > 0 ? cd.toFixed(1) + "s" : "idle"}</div>
      </div>
    </div>`;
  }).join("");
  document.getElementById("chars").querySelectorAll(".row").forEach(r => r.addEventListener("click", () => {
    hostedIndex = Number(r.dataset.i); hostedElapsed = 0; renderHosted(); renderChars();
  }));
}

function renderFeed() {
  const feed = world.feed || [];
  if (!feed.length) {
    document.getElementById("feed").innerHTML = `<div class="feed-row"><span class="fact">nothing yet — start a run</span></div>`;
    return;
  }
  const now = Date.now();
  document.getElementById("feed").innerHTML = feed.slice(0, 12).map(f => {
    const pal = charColor(f.character);
    const age = Math.round((now - new Date(f.at)) / 1000);
    const av = pal.sprite ? `<img src="${pal.sprite}">` : `<span style="width:16px;height:16px;border-radius:50%;background:#fefbf1;border:1.5px solid ${pal.color};color:${pal.color};font:800 7px system-ui;display:inline-grid;place-items:center">${f.character.slice(0,2).toUpperCase()}</span>`;
    return `<div class="feed-row">
      ${av}
      <span class="fname" style="color:${pal.color}">${f.character}</span>
      <span class="fact">${VERB[f.action] || f.action}</span>
      <span class="fago">${age < 60 ? age + "s" : Math.round(age / 60) + "m"}</span>
    </div>`;
  }).join("");
}

// Pan and zoom.
let dragging = null;
stage.addEventListener("mousedown", (ev) => {
  dragging = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
  stage.classList.add("dragging");
});
window.addEventListener("mouseup", () => { dragging = null; stage.classList.remove("dragging"); });
window.addEventListener("mousemove", (ev) => {
  if (!dragging) return;
  view.tx = dragging.tx + (ev.clientX - dragging.x);
  view.ty = dragging.ty + (ev.clientY - dragging.y);
  const g = svg.querySelector("#viewport");
  if (g) g.setAttribute("transform", `translate(${view.tx} ${view.ty}) scale(${view.scale})`);
});
stage.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.2 : 1 / 1.2;
  const next = Math.max(0.5, Math.min(8, view.scale * factor));
  view.tx = mx - (mx - view.tx) * (next / view.scale);
  view.ty = my - (my - view.ty) * (next / view.scale);
  view.scale = next;
  const g = svg.querySelector("#viewport");
  if (g) g.setAttribute("transform", `translate(${view.tx} ${view.ty}) scale(${view.scale})`);
}, { passive: false });

window.addEventListener("resize", () => { view.initialised = false; renderMap(); });

async function poll() {
  try {
    mapMeta = computeMeta(world.bounds);
    const res = await fetch("/api/world", { cache: "no-store" });
    world = await res.json();
    if (!Object.keys(world.bounds).length) {
      document.getElementById("status").textContent = world.error || "no tiles cached";
      return;
    }
    if (!world.bounds[activeLayer]) activeLayer = Object.keys(world.bounds)[0];
    document.getElementById("status").textContent =
      `${world.tiles.length} tiles · ${world.characters.length} live · ${new Date(world.fetched_at).toLocaleTimeString()}`;
    renderLayerButtons();
    renderMap();
    renderHosted();
    renderChars();
    renderFeed();
  } catch (err) {
    document.getElementById("status").textContent = "server unreachable";
  }
}

// Auto-rotate the hosted persona.
setInterval(() => {
  hostedElapsed += 1;
  if (hostedElapsed >= HOST_ROTATE_S) {
    hostedElapsed = 0;
    hostedIndex = (hostedIndex + 1) % Math.max(1, world.characters.length);
    renderChars();
  }
  renderHosted();
}, 1000);

loadWanManifest().then(poll);
setInterval(poll, 2000);
</script>
</body>
</html>
