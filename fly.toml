app = "artifacts-mmo-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ARTIFACTS_MMO_API_URL = "https://api.artifactsmmo.com"
  TRACE_DIR = "/data/traces"

[[mounts]]
  source = "traces"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
